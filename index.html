<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Ceylon Voyage — Luxury Sri Lanka Tours & Best Journeys</title>

    <meta
      name="description"
      content="Discover Sri Lanka through curated luxury tours: pristine beaches, misty highlands, ancient temples and unforgettable wildlife safaris."
    />

    <meta
      property="og:title"
      content="Ceylon Voyage — Luxury Sri Lanka Tours"
    />

    <meta
      property="og:description"
      content="Bespoke Sri Lanka journeys crafted for the discerning traveler."
    />

    <meta property="og:type" content="website" />

    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>

  <body>
    <div id="root"></div>

    <!--
      Google Translate
      Hidden default Google UI.
      The custom language selector in React controls it.
    -->
    <div id="google_translate_element"></div>

    <script>
      function googleTranslateElementInit() {
        new google.translate.TranslateElement(
          {
            pageLanguage: "en",
            includedLanguages: "en,si,ta,hi,ar,fr,zh-CN,ja,ru",
            autoDisplay: false,
          },
          "google_translate_element"
        );
      }
    </script>

    <!-- Google Translate Script -->
    <script
      src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
    ></script>

    <!-- React/Vite -->
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>
